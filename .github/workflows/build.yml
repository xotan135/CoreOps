name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetworkAdmin.slnx --locked-mode

      - name: Build
        run: dotnet build NetworkAdmin.slnx -c Release --no-restore

      - name: Publish Windows x64
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish NetworkAdmin.App/NetworkAdmin.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o publish/win-x64

      - name: Upload unsigned release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: CoreOps-${{ github.ref_name }}-win-x64-unsigned
          path: |
            publish/win-x64/CoreOps.exe
            LICENSE
            PRIVACY.md
            SECURITY.md
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
